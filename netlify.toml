[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Daily membership-expiry sweep. Netlify cron runs in UTC; 23:05 UTC = 00:05
# WAT, just after midnight in the association's timezone.
[functions."expiry-sweep"]
  schedule = "5 23 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com; connect-src 'self' https://esm.sh https://cdn.jsdelivr.net https://ranified.netlify.app https://portal.recyclersassociation.org;"
    Referrer-Policy = "no-referrer"